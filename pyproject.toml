[build-system]
requires = ["scikit-build-core", "torch"]
build-backend = "scikit_build_core.build"

[project]
name = "tiberate"
version = "0.9.11"
description = "T(yped-l)iberate-fhe: a variant of Liberate-fhe with better typing"
authors = [
    { name = "Juwhan Kim", email = "juwhan.kim@desilo.ai" },
    { name = "Hanyul Ryu", email = "hanyul.ryu@desilo.ai" },
    { name = "Gavin Gong", email = "gavin@gong.host" },
    { name = "PuQing", email = "me@puqing.work" },
]
requires-python = ">=3.10"
maintainers = [
    { name = "Gavin Gong", email = "gavin@gong.host>" },
    { name = "PuQing", email = "me@puqing.work" },
]
readme = "README.md"
license = "BSD-3-Clause-Clear"
keywords = [
    "python",
    "cryptoghraphy",
    "privacy",
    "encryption",
    "cuda",
    "homomorphic encryption",
    "homomorphic encryption library",
    "fhe",
]
classifiers = [
    "Environment :: GPU :: NVIDIA CUDA",
    "Programming Language :: Python",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "click>=8.1.8",
    "joblib>=1.4.2",
    "loguru>=0.7.3",
    "matplotlib>=3.10.1",
    "mpmath>=1.3.0",
    "numpy>=2.2.5",
    "nvtx>=0.2.11",
    "plotext>=5.3.2",
    "rich>=14.0.0",
    "scikit-build-core>=0.11.1",
    "scipy>=1.15.2",
    "textual[syntax]>=3.1.1",
    "torch>=2.6.0",
    "vdtoys>=0.1.5",
]
[project.urls]
Repository = "https://github.com/VisualDust/tiberate-fhe"

[tool.scikit-build]
build-dir = "build"
cmake.args = ["-DCMAKE_EXPORT_COMPILE_COMMANDS=ON"]
cmake.verbose = true
wheel.install-dir = "tiberate"
wheel.packages = ["tiberate"]

[project.scripts]
tiberate = "tiberate._cli.main:options"


[tool.ruff]
exclude = ["./build"]
line-length = 80
target-version = "py310"

[tool.ruff.format]
# Prevent change to double quotes by some users use ruff format
quote-style = "preserve"

[tool.ruff.lint]
unfixable = ["NPY001"]
ignore = [
    # Module level import not at top of file
    "E402",
    # Line too long (82 > 79 characters)
    "E501",
    # Do not assign a lambda expression, use a def
    "E731",
    # Do not use variables named ‘l’, ‘O’, or ‘I’
    "E741",
    # `name` may be undefined, or defined from star imports: `module`
    "F405",
    # Local variable name is assigned to but never used
    "F841",
    # It not met the "Explicit is better than implicit" rule
    "UP015",
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["tiberate"]

[dependency-groups]
dev = ["pydot>=3.0.4", "pytest>=8.3.5", "tabulate>=0.9.0", "ubelt>=1.3.7"]
